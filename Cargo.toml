[package]
name = "argus-client"
version = "0.2.1"
edition = "2021"
description = "Argus persistent reverse relay client and VM watchdog"
license = "MIT"

[dependencies]
anyhow = "1"
hex = "0.4"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
